name: Check pinned installer versions

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - "README.md"
      - "TOKEN_OPTIMIZATION_STACK.md"
      - "setup.sh"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned versions against upstream
        run: bash scripts/check-pinned-versions.sh

      - name: Open issue on drift (scheduled runs only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Pinned installer versions are stale" \
            --body "Scheduled check found pinned versions in README.md / TOKEN_OPTIMIZATION_STACK.md / setup.sh are behind upstream. Run \`scripts/check-pinned-versions.sh\` locally, bump the pinned tags, re-verify checksums, and update the docs." \
            --label documentation
